# 版本号单一来源：jar 名、zip 名、plugin.xml 的 <version> 均由此决定
pluginVersion=0.3.0

# 目标平台（IntelliJ Platform）
# local() 模式：指向本机 IDEA 安装目录，零下载，编译与运行时同一 build
# 可用 -PplatformLocalPath=... 或 ~/.gradle/gradle.properties 覆盖
platformLocalPath=D:/IDEA/2026.2
sinceBuild=262
javaVersion=25

# JDK 位置：Gradle 启动可用任一 17+ JDK，编译目标 25 由 toolchain 指定
# 此项告诉 Gradle 在哪找 JDK 25（不配置时 toolchain 会报 Cannot find a Java installation）
# 换机器时用 -Dorg.gradle.java.installations.paths=... 或改此处
org.gradle.java.installations.paths=D:/jdk-25
org.gradle.java.installations.auto-detect=true

# 发布到 JetBrains Marketplace 的个人访问令牌（本地留空，用命令行或环境变量传入）
# gradlew publishPlugin -PintellijPlatformPublishingToken=...
# 或 export ORG_GRADLE_PROJECT_intellijPlatformPublishingToken=...
intellijPlatformPublishingToken=

# 调试与性能
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
